name: factory-os CI

on:
  push:
    paths:
      - 'factory-os/**'
      - '.github/workflows/factory-os.yml'
  pull_request:
    paths:
      - 'factory-os/**'
      - '.github/workflows/factory-os.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-os-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: factory-os

jobs:
  verify:
    name: Typecheck · Lint · Spec · Tests (con PostgreSQL) · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: factory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/factory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: factory-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run spec:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Smoke E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: factory-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Arrancar servidor (memoria) y preview del frontend
        run: |
          PORT=8080 LOG_LEVEL=warn SIM_SPEED=25 SIM_SEED=7 node apps/server/dist/main.js &
          npm run preview -w @factory-os/web -- --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/api/health && break; sleep 1; done
      - run: npm run smoke
        env:
          BASE_URL: http://localhost:4173
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-os-smoke-screenshots
          path: factory-os/artifacts/
          if-no-files-found: ignore

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
